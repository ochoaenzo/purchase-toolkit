[project]
name = "purchase-toolkit"
version = "0.1.0"
description = "Librerías para auditoría, extracción y unificación de datos de órdenes de compra."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.15.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
