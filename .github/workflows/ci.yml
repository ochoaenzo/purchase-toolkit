name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sincronizar entorno
        run: uv sync

      - name: Lint con ruff
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -v
